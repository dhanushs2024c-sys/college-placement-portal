
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: placement-portal
  template:
    metadata:
      labels:
        app: placement-portal
    spec:
      containers:
        - name: placement-portal
          image: dhan01/noticeboard:latest
          ports:
            - containerPort: 80
